name: Build FxSound Standalone (v1.2.18-pourih)

on:
  push:
    branches:
      - main
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Inno Setup
        shell: powershell
        run: |
          Write-Host "Installing Inno Setup 6..."
          choco install innosetup --no-progress
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $isccPath) {
            Write-Host "Inno Setup compiler found at $isccPath"
            echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            throw "ISCC.exe not found after installation."
          }

      - name: Clone FxSound develop/windows
        shell: powershell
        run: |
          Write-Host "Cloning develop/windows branch from upstream fxsound2/fxsound-app..."
          git clone --branch develop/windows --depth 1 https://github.com/fxsound2/fxsound-app.git src
          Write-Host "FxSound source tree ready."

      - name: Apply Performance, CLI & Stability Patches
        shell: powershell
        run: |
          & .\scripts\patch-fxsound.ps1 -SrcDir src

      - name: Setup JUCE 8
        shell: powershell
        run: |
          Write-Host "Cloning JUCE 8 modules to C:\JUCE8..."
          git clone --branch 8.0.6 --depth 1 https://github.com/juce-framework/JUCE.git C:\JUCE8
          if (-not (Test-Path "C:\JUCE8\modules")) {
            throw "JUCE modules directory not found at C:\JUCE8\modules"
          }
          Write-Host "JUCE 8 ready."

      - name: Build FxSound.sln (Release x64)
        shell: cmd
        working-directory: src
        run: |
          msbuild fxsound\Project\FxSound.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /m /v:minimal

      - name: Verify build outputs & Version Branding
        shell: powershell
        run: |
          $exe = "src\bin\x64\FxSound.exe"
          if (-not (Test-Path $exe)) {
            $fallback = "src\fxsound\Project\x64\Release\App\FxSound.exe"
            if (Test-Path $fallback) {
              Copy-Item $fallback $exe -Force
            } else {
              throw "Build failed: FxSound.exe was not generated."
            }
          }
          $verInfo = (Get-Item $exe).VersionInfo
          Write-Host "Built executable version:" -ForegroundColor Green
          Write-Host "  Product Version: $($verInfo.ProductVersion)"
          Write-Host "  File Version:    $($verInfo.FileVersion)"
          if ($verInfo.ProductVersion -ne "1.2.18-pourih") {
            Write-Warning "Expected ProductVersion 1.2.18-pourih, got $($verInfo.ProductVersion)"
          }

      - name: Compile Inno Setup Installer
        shell: cmd
        run: |
          iscc Installer\FxSound_Setup.iss

      - name: Verify Installer Executable
        shell: powershell
        run: |
          $installer = Get-ChildItem "installer_output\fxsound_setup_*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Installer executable not found in installer_output!"
          }
          Write-Host "Created standalone installer: $($installer.FullName) ($($installer.Length) bytes)" -ForegroundColor Green

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fxsound_setup_1.2.18-pourih
          path: installer_output/
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.18-pourih
          name: FxSound v1.2.18-pourih (Standalone Installer)
          body: |
            Standalone Windows installer for FxSound v1.2.18-pourih with integrated Microsoft WHQL-signed audio driver, idle CPU throttle fix, audio service leak fixes, and headless CLI automation.
            
            ### Direct Download
            Download **`fxsound_setup_1.2.18-pourih.exe`** below and run as Administrator.
          files: installer_output/fxsound_setup_*.exe
          fail_on_unmatched_files: true
